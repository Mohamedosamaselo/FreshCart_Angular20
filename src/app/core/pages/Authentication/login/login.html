<form [formGroup]="loginForm"
  (ngSubmit)="onSubmit()"
  class="max-w-md mx-auto p-8 my-10 shadow-lg">
  <h2 class="text-center font-medium text-3xl mb-6">Login</h2>

  <!-- API(signUp) Error -->
  @if (apiError()) {
  <div
    class="p-4 my-4 text-sm text-center text-red-800 rounded-lg bg-red-50 dark:bg-gray-800 dark:text-red-500"
    role="alert">
    <span class="font-medium">{{ apiError() }} !!</span>
  </div>
  }

  <!-- Email -->
  <div class="relative z-0 w-full mb-5 group">
    @let emailControl = formControls['email'];<!-- emailControl variable   -->
    <!-- <input
      formControlName="email"
      type="email"
      name="floating_email"
      id="floating_email"
      class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none dark:text-black dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer"
      placeholder=" "
      required /> -->

    <app-custom-input-component
      formControlName="email"
      type="email"
      id="floating_email"
      name="floating_email"
      placeholder="please Enter your email"
      required="true">
    </app-custom-input-component>
    <label
      for="floating_email"
      class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
      Email
    </label>

    <!-- /////////////////////////////////////////////////// Email error Alert /////////////////////////////// -->
    <!-- @if (emailControl.invalid && emailControl.touched) {
    <div class="text-red-600 text-xs mt-1">
      @if (emailControl.errors?.['required']) {
      <span>Email is required</span>
      } @else if (emailControl.errors?.['email']) {
      <span>Invalid email format</span>
      }
    </div>
    }
     -->
    <app-error-message [Control]="emailControl"></app-error-message>
  </div>

  <!-- Password -->
  <div class="relative z-0 w-full mb-5 group">
    @let passwordControl =
    formControls['password'];<!-- passwordControl variable   -->

    <!-- <input
      #passwordInput
      formControlName="password"
      [type]="showPassword ? 'text' : 'password'"
      id="floating_password"
      class="block py-2.5 px-0 w-full text-sm text-gray-900 bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-blue-600 peer pr-10"
      placeholder=" "
      required
    />
    -->
    <app-custom-input-component
      #passwordInput
      formControlName="password"
      [type]="showPassword() ? 'text' : 'password'"
      id="floating_password"
      name="floating_password"
      placeholder="please Enter your password "
      required="true">
    </app-custom-input-component>

    <label
      for="floating_password"
      class="peer-focus:font-medium absolute text-sm text-gray-500 dark:text-gray-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-focus:start-0 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto peer-focus:text-blue-600 peer-focus:dark:text-blue-500 peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6">
      Password
    </label>
    <button
      type="button"
      (click)="togglePasswordVisibility()"
      class="absolute right-0 top-3 text-gray-500 hover:text-gray-700 focus:outline-none">
      <i
        [class]="showPassword() ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'"></i>
    </button>

    <!--/////////////////////////////////////////////////// Password Error Alert////////////////////  -->
    <!-- @if (passwordControl.invalid && passwordControl.touched) {
    <div class="text-red-600 text-xs mt-1">
      @if (passwordControl.errors?.['required']) {
      <span>Password is required</span>
      } @else if (passwordControl.errors?.['minlength']) {
      <span>Password must be at least 6 characters</span>
      } @else if (passwordControl.errors?.['pattern']) {
      <span>Password must contain uppercase, lowercase, number and special character</span>
      }
    </div>
    } -->
    <app-error-message [Control]="passwordControl"></app-error-message>
  </div>

  <!-- Submit Button  -->
  <button
    type="submit"
    [disabled]="loginForm.invalid || isLoading()"
    class="text-blue-500 bg-slate-300 ms-auto font-extrabold rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center transition-all duration-200 flex items-center justify-center gap-2"
    [ngClass]="{
      'cursor-not-allowed': loginForm.invalid || isLoading(),
      'hover:bg-blue-800 text-white': loginForm.valid && !isLoading()
    }">
    @if (isLoading()) {
    <i class="fa-solid fa-spinner fa-spin"></i>
    <span>Loading . . .</span>
    } @else {
    <span>login</span>
    }
  </button>
</form>
