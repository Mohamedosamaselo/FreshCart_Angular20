<ngx-spinner type="ball-scale-multiple"></ngx-spinner>

<mat-stepper #stepper class="w-3/4 m-auto border shadow-md rounded-md">
  <!-- First step  -->
  <mat-step [stepControl]="verifyemailForm">
    <form [formGroup]="verifyemailForm" class="flex flex-col items-center">
      <ng-template matStepLabel>Email </ng-template>

      <mat-form-field class="w-3/4 block mx-auto">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Enter Your Email please "
          formControlName="email" required />
      </mat-form-field>

      <div>
        <button matButton matStepperNext [disabled]="loading()"
          (click)="sendEmail(stepper)">
          Send Email
        </button>
      </div>
    </form>
  </mat-step>
  <!-- Second Step  -->
  <mat-step [stepControl]="verifycodeForm" label="OTP CODE">
    <form [formGroup]="verifycodeForm" class="flex flex-col items-center">
      <mat-form-field class="w-3/4 mx-auto block">
        <mat-label>ResetCode</mat-label>
        <input matInput formControlName="resetCode"
          placeholder="Enter Your OTPCode " required />
      </mat-form-field>

      <div>
        <button matButton matStepperPrevious>Back</button>
        <button matButton matStepperNext [disabled]="loading()"
          (click)="sendOtpCode(stepper)">
          Send otp code
        </button>
      </div>
    </form>
  </mat-step>

  <!-- third step -->
  <mat-step>
    <ng-template matStepLabel>New Password </ng-template>
    <form [formGroup]="resetPasswordForm" class="flex flex-col items-center">
      <!-- <ng-template matStepLabel>Email </ng-template> -->
      <mat-form-field class="w-3/4 mx-auto block">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Enter Your Email please "
          formControlName="email" required
          [value]="this.verifyemailForm.value.email" />
      </mat-form-field>

      <mat-form-field class="w-3/4 mx-auto block">
        <mat-label>new Password </mat-label>
        <input
          matInput
          placeholder="Enter Your new Password please "
          formControlName="newPassword"
          required />
      </mat-form-field>

      <div>
        <!-- <button matButton matStepperPrevious>Back</button> -->
        <button matButton matStepperNext [disabled]="loading()"
          (click)="sendNewPassword()">
          Send New Password
        </button>
      </div>
    </form>

    <div>
      <button matButton matStepperPrevious>Back</button>
      <button matButton (click)="stepper.reset()">Reset</button>
    </div>
  </mat-step>
</mat-stepper>
