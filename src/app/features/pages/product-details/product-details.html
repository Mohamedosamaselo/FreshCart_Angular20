@if (!productDetails) {
<div class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Loading product details...</p>
</div>
} @else{
<div class="flex justify-between items-center gap-4 my-5 ">
    <div class="w-[35%]">
        <owl-carousel-o [options]="customOptions">
            @for (src of productDetails.images; track $index) {
            <ng-template carouselSlide [id]="src">
                <img [src]="src" class="w-full" alt="productImage">
            </ng-template>
            }
        </owl-carousel-o>
    </div>
    <div class="w-[60%]">
        <h2 class="text-4xl">{{productDetails.title}}</h2>
        <p>{{productDetails?.description}}</p>
        <span class="text-main text-xl">{{productDetails?.category?.name}}</span>
        <div class="flex items-center justify-between my-5">
            <span class="small"> {{productDetails.price | currency}}</span>
            <p class="mb-0">
                <i class="fas fa-star text-[#ffc908]"></i>
                {{productDetails.ratingsAverage}}
            </p>
        </div>
        <!-- AddToCardButton -->
        <button class="bg-main opacity-100 transition-all duration-700 text-white rounded-md  w-[80%] block mx-auto  translate-y-[100%] group-hover:translate-y-[0%]  p-3">
            Add To Cart +
        </button>
    </div>
</div>
}
