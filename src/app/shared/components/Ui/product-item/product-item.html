<div class="product mb-4 group border  border-gray-100 p-2 rounded-xl">
  <img [src]="ProductInput.imageCover" class="w-full" alt="productCover">
  <span class="text-main">{{ProductInput.category.name}}</span>
  <h2 class="mb-4">{{ProductInput.title.split(" ").slice(0,2).join(" ")}}</h2>
  <div class="flex justify-between mb-4">
    <p>{{ProductInput.price | currency}}</p>
    <p><i class="fa fa-star text-rating"></i>{{ProductInput.ratingsAverage}} </p>
  </div>
  <button
    class="bg-main opacity-0 group-hover:opacity-100 transition-all duration-700 text-white rounded-md  w-[90%] block m-auto  translate-y-[100%] group-hover:translate-y-[0%]  p-3">
    Add To Cart +
  </button>
</div>
