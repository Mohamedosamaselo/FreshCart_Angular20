<input
  [type]="type"
  [id]="id"
  [name]="name"
  [required]="required"
  [placeholder]="placeholder"
  [disabled]="disabled"
  [value]="value"
  (blur)="OnTouched()"
  (input)="UpdateValue($event)"
  class="
  block pt-5  px-0  w-full text-sm text-gray-900 bg-transparent border-0 border-b-2  border-gray-300 appearance-none dark:text-black dark:border-gray-600 dark:focus:border-blue-500 focus:outline-none focus:ring-0 focus:border-blue-600 peer" />
